ary": true, "nonProprietaryName": "Amoxycillin + Clavulanic Acid 500mg+125mg Tablet", "dosageForm": "Tablet", "description": "Augmentin 625 Duo Tablet is an antibiotic that helps your body fight infections caused by bacteria. It treats infections of the lungs (e.g., pneumonia), the ear, the nasal sinus, the urinary tract, the skin, and the soft tissue. It will not work for viral infections such as the common cold.Augmentin 625 Duo Tablet is best taken with a meal to reduce the chance of stomach upset. Take it regularly at evenly spaced intervals as prescribed by your doctor. Take it at the same time daily to help you remember. The dose will depend on the type and severity of the condition, as well as your body weight. Complete the full course of treatment. Do not stop taking it, even if you feel better. If you stop it early, some bacteria may survive, and the infection may return or worsen.The most common side effects of Augmentin 625 Duo Tablet include recurrent or persistent fungal infection (mucocutaneous candidiasis), nausea, diarrhea, and vomiting. If you experience any symptoms that are persistent or get worse, consult your doctor.Before taking Augmentin 625 Duo Tablet, let your doctor know if you are allergic to any antibiotics or have kidney or liver problems. You should also inform your doctor about all other medicines you are taking. They may affect or be affected by Augmentin 625 Duo Tablet. Pregnant and breastfeeding women should consult their doctor before taking this medicine to make sure it is safe for them.", "name": "Augmentin 625 Duo Tablet", "proprietaryName": "Augmentin 625 Duo Tablet", "availableStrength": [{"@type": "DrugStrength", "activeIngredient": "Amoxycillin + Clavulanic Acid", "strengthUnit": "mg+125mg", "strengthValue": "500"}], "mechanismOfAction": ["Augmentin 625 Duo Tablet is a combination of two medicines: Amoxycillin  and  Clavulanic Acid.  Amoxycillin  is an antibiotic.  It works by preventing the formation of the bacterial protective covering, which is essential for the survival of bacteria.   Clavulanic Acid is a beta-lactamase inhibitor that reduces resistance and enhances the activity of Amoxycillin  against bacteria."], "doseSchedule": {"@type": "DoseSchedule", "doseUnit": "", "doseValue": "", "frequency": ""}, "image": "https://onemg.gumlet.io/l_watermark_346,w_480,h_480/a_ignore,w_480,h_480,c_fit,q_auto,f_auto/eluna27m2ptghojxlawz.png", "brand": {"@type": "Brand", "name": "Augmentin"}, "offers": {"@type": "Offer", "url": "/drugs/Augmentin-Tablet-138629", "priceCurrency": "INR", "availability": "http://schema.org/OutOfStock", "price": 195.3, "seller": {"@type": "Organization", "name": "Glaxo SmithKline Pharmaceuticals Ltd"}}, "author": [{"@type": "http://schema.org/author", "givenName": "Dr. Swati Mishra", "jobTitle": "BDS", "url": "https://www.1mg.com/editorial-policy-processes/dr.-swati-mishra-12", "affiliation": {"@type": "Organization", "name": "BDS"}}], "reviewer": [{"@type": "http://schema.org/reviewedby", "givenName": "Dr. Rajeev Sharma", "jobTitle": "MBA, MBBS", "url": "https://www.1mg.com/editorial-policy-processes/dr.-rajeev-sharma-90", "affiliation": {"@type": "Organization", "name": "MBA, MBBS"}}], "dateModified": "2026-10-10T01:01:24+05:30", "datePublished": "2016-04-30T03:27:06+05:30", "citation": [{"@type": "CreativeWork", "position": 1, "url": "https://www.accessdata.fda.gov/drugsatfda_docs/label/2008/050575s037550597s044050725s025050726s019lbl.pdf"}, {"@type": "CreativeWork", "position": 2, "url": "https://www.medicines.org.uk/emc/files/pil.281.pdf"}, {"@type": "CreativeWork", "position": 3, "url": "https://www.medicines.org.uk/emc/product/281/smpc "}]}}}}}};</script></html>
