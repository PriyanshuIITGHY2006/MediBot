</g>
<text x="235" y="139" font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-2.2" fill="#15384B">Medi<tspan fill="#0DA99E">Bot</tspan></text>
